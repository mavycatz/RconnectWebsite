<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fare Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
    }

    .box {
      background: white;
      padding: 20px;
      max-width: 700px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
    }

    h2 {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .hint {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>🧠 Fare Chat Trainer</h2>

    <input
      id="fare-chat-input"
      type="text"
      placeholder="cabanatuan to rizal is 78 regular, 62 student, 62 special"
    />

    <button id="fare-chat-send">Save Fare</button>

    <div class="hint">
      Format:<br>
      <code>FROM to TO is REGULAR regular, STUDENT student, SPECIAL special</code>
    </div>
  </div>

  <!-- IMPORTANT: MODULE SCRIPT -->
  <script type="module" src="/assets/js/fareChatTrainer.js"></script>

</body>
</html>
